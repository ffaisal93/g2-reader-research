name: g2-reader-lab
captured: "2026-08-17"
platform: linux-x86_64
python: "3.12.3"
environment_path: g2_reader_lab/.venv
decision_notes:
  - Python 3.12 was the only host interpreter; 3.10 and 3.11 were not on PATH.
  - PyTorch uses its official CUDA 12.6 wheel; no system CUDA toolkit is required.
  - The upstream requirements.txt was not installed.
install_commands:
  - python3 -m venv g2_reader_lab/.venv
  - g2_reader_lab/.venv/bin/python -m pip install --upgrade pip uv
  - >-
    g2_reader_lab/.venv/bin/python -m pip install numpy pydantic PyYAML openai
    Pillow scikit-learn tiktoken tqdm loguru pandas aiohttp
    langchain-text-splitters PyPDF2 pytest pytest-asyncio
  - >-
    g2_reader_lab/.venv/bin/python -m pip install torch==2.7.1+cu126
    --index-url https://download.pytorch.org/whl/cu126
