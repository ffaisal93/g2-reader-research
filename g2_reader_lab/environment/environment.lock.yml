model_runtime_notes:
  - Qwen2.5-VL-7B-Instruct produces malformed output in FP16 on this host.
  - BF16 was validated on the V100 and is required by the experiment profiles.
  - Both model checkpoints are loaded only from /mnt/maxtox-nfs-student/zff/models.
shared_service_envelope:
  endpoint: http://127.0.0.1:18000/v1
  attention: sdpa
  dtype: bfloat16
  max_input_characters: 20000
  max_visual_pixels: 262144
  max_output_tokens: 1024
  cuda_allocator: expandable_segments:True
  cleanup: reset peak statistics before and empty CUDA cache after each request
  notes:
    - The matched endpoint uses a 20,000-character head-tail envelope and 512x512 maximum image area to remain below V100 memory limits.
